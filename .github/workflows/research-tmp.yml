name: Temporary research fetch
on:
  push:
    branches: [main]
    paths: ["research/request.txt"]
permissions:
  contents: write
concurrency:
  group: research
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Analysts and implied volatility for new stocks
        run: |
          node scripts/fetch-analysts.mjs $(cat research/request.txt) > research/log-an.txt 2>&1 || true
          node scripts/fetch-options.mjs iv $(cat research/request.txt) > research/log-iv.txt 2>&1 || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research */analysts.json */vol.json
          git commit -q -m "Analysts and volatility for $(cat research/request.txt)" || echo nothing
          git pull -q --rebase origin main && git push -q
