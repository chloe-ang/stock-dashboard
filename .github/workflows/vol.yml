name: Record implied volatility

on:
  workflow_dispatch:
  schedule:
    # Once a day after the US close (21:50 UTC = 5:50pm EDT / 4:50pm EST), Mon–Fri
    - cron: "50 21 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: vol
  cancel-in-progress: false

jobs:
  iv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add today's 30-day IV to each stock's vol.json
        run: node scripts/fetch-options.mjs iv

      - name: Commit if changed
        id: commit
        run: |
          git add */vol.json
          if git diff --cached --quiet; then
            echo "No new IV data."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Record 30-day implied volatility"
          git pull -q --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
